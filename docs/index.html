<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>커서로 Next.js 앱 개발하기</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="AI와 함께하는 3일 완성 Next.js 강의">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

  <!-- 테마 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">

  <!-- 커스텀 스타일 -->
  <style>
    :root {
      --theme-color: #f97316;
      --sidebar-nav-link-color--active: #f97316;
      --sidebar-nav-link-border-color--active: #f97316;
      --link-color: #f97316;
      --blockquote-border-color: #f97316;
    }

    .sidebar-nav > ul > li > a {
      font-weight: bold;
      font-size: 1.1em;
    }

    .markdown-section h1 {
      border-bottom: 2px solid #f97316;
      padding-bottom: 10px;
    }

    .markdown-section code {
      background-color: #f3f4f6;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .markdown-section pre {
      background-color: #1f2937 !important;
      border-radius: 8px;
    }

    .markdown-section table {
      display: table;
      width: 100%;
    }

    .markdown-section blockquote {
      background-color: #fff7ed;
      border-left: 4px solid #f97316;
      padding: 1em;
      border-radius: 0 8px 8px 0;
    }

    /* 이모지 크기 */
    .sidebar-nav li a {
      font-size: 0.95em;
    }

    /* 검색창 스타일 */
    .search input {
      border-radius: 8px !important;
      border: 1px solid #e5e7eb !important;
    }

    .search input:focus {
      border-color: #f97316 !important;
      box-shadow: 0 0 0 2px rgba(249, 115, 22, 0.2) !important;
    }
  </style>
</head>
<body>
  <div id="app">로딩 중...</div>

  <script>
    window.$docsify = {
      name: '🎓 커서로 Next.js 앱 개발하기',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,

      // 검색 설정
      search: {
        placeholder: '검색어를 입력하세요',
        noData: '검색 결과가 없습니다',
        depth: 3
      },

      // 복사 버튼
      copyCode: {
        buttonText: '복사',
        successText: '복사됨!'
      },

      // 페이지네이션
      pagination: {
        previousText: '이전',
        nextText: '다음',
        crossChapter: true
      },

      // 탭
      tabs: {
        persist: true,
        sync: true
      },

      // 404 페이지
      notFoundPage: true,

      // 기본 경로 (GitHub Pages에서 docs 폴더 사용시 불필요)
      // basePath: '',

      // 홈페이지
      homepage: 'README.md',

      // 이름 링크
      nameLink: '/',

      // 마지막 수정 시간
      formatUpdated: '{YYYY}-{MM}-{DD} {HH}:{mm}',
    }
  </script>

  <!-- Docsify 코어 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>

  <!-- 플러그인들 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-tabs@1"></script>

  <!-- 코드 하이라이팅 -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-tsx.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
</body>
</html>
