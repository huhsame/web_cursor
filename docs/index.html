<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>허세임AI 웹개발</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="AI와 함께하는 3일 완성 웹개발 강의">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">

  <!-- 테마 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify-themeable@0/dist/css/theme-simple.css">

  <!-- 커스텀 스타일 (블랙앤화이트) -->
  <style>
    :root {
      --theme-color: #000000;
      --sidebar-nav-link-color--active: #000000;
      --sidebar-nav-link-border-color--active: #000000;
      --link-color: #000000;
      --blockquote-border-color: #333333;
    }

    /* 사이드바 로고/프로필 */
    .app-name-link img {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin-bottom: 10px;
    }

    .app-name-link {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .sidebar-nav > ul > li > a {
      font-weight: bold;
      font-size: 1.1em;
    }

    .markdown-section h1 {
      border-bottom: 2px solid #000000;
      padding-bottom: 10px;
    }

    .markdown-section code {
      background-color: #f3f4f6;
      padding: 2px 6px;
      border-radius: 4px;
      color: #000;
    }

    .markdown-section pre {
      background-color: #1a1a1a !important;
      border-radius: 8px;
    }

    /* 한글 표 너비 수정 */
    .markdown-section table {
      display: table;
      width: 100%;
      border-collapse: collapse;
      table-layout: auto;
    }

    .markdown-section table th,
    .markdown-section table td {
      padding: 12px 16px;
      border: 1px solid #e5e7eb;
      white-space: nowrap;
      word-break: keep-all;
    }

    .markdown-section table th {
      background-color: #f9fafb;
      font-weight: 600;
      text-align: left;
    }

    .markdown-section table td:first-child,
    .markdown-section table th:first-child {
      white-space: nowrap;
    }

    .markdown-section table td:last-child,
    .markdown-section table th:last-child {
      white-space: normal;
      word-break: break-word;
    }

    .markdown-section blockquote {
      background-color: #f5f5f5;
      border-left: 4px solid #000000;
      padding: 1em;
      border-radius: 0 8px 8px 0;
    }

    /* 이모지 크기 */
    .sidebar-nav li a {
      font-size: 0.95em;
    }

    /* 검색창 스타일 */
    .search input {
      border-radius: 8px !important;
      border: 1px solid #cccccc !important;
    }

    .search input:focus {
      border-color: #000000 !important;
      box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.1) !important;
    }

    /* 링크 호버 */
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div id="app">로딩 중...</div>

  <script>
    window.$docsify = {
      name: '<img src="https://github.com/huhsame.png" alt="profile"><br>허세임AI 웹개발',
      repo: '',
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,

      // 검색 설정
      search: {
        placeholder: '검색어를 입력하세요',
        noData: '검색 결과가 없습니다',
        depth: 3
      },

      // 복사 버튼
      copyCode: {
        buttonText: '복사',
        successText: '복사됨!'
      },

      // 페이지네이션
      pagination: {
        previousText: '이전',
        nextText: '다음',
        crossChapter: true
      },

      // 탭
      tabs: {
        persist: true,
        sync: true
      },

      // 404 페이지
      notFoundPage: true,

      // 홈페이지
      homepage: 'README.md',

      // 이름 링크
      nameLink: '/',

      // 마지막 수정 시간
      formatUpdated: '{YYYY}-{MM}-{DD} {HH}:{mm}',
    }
  </script>

  <!-- Docsify 코어 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>

  <!-- 플러그인들 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-tabs@1"></script>

  <!-- 코드 하이라이팅 -->
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-tsx.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
</body>
</html>
